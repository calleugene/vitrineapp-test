# All eight APIs and the web gateway. Each backend owns its PostgreSQL database.
# Set secrets and public URLs in .env before starting.
x-backend: &backend
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viralabs
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: viralabs
      POSTGRES_MULTIPLE_DATABASES: "viralabs_auth viralabs_artifacts viralabs_visitor viralabs_analytics viralabs_route viralabs_feedback viralabs_notification"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralabs"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    <<: *backend
    build: ./Backend/auth-service
    environment:
      AUTH_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_auth"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET}"
      AUTH_HTTP_ADDR: ":8080"
      MUSEUM_SERVICE_URL: http://artifacts-service:8081/api/v1
      AUTH_PUBLIC_URL: "${PUBLIC_URL:?set PUBLIC_URL}/methodist/"
      AUTH_TRUSTED_PROXY_CIDRS: "${AUTH_TRUSTED_PROXY_CIDRS:-}"
      AUTH_SMTP_ADDR: "${AUTH_SMTP_ADDR:-}"
      AUTH_SMTP_USER: "${AUTH_SMTP_USER:-}"
      AUTH_SMTP_PASSWORD: "${AUTH_SMTP_PASSWORD:-}"
      AUTH_MAIL_FROM: "${AUTH_MAIL_FROM:-}"
  artifacts-service:
    <<: *backend
    build: ./Backend/artifacts-service
    environment:
      ARTIFACTS_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_artifacts"
      ARTIFACTS_TOKEN_SECRET: "${AUTH_TOKEN_SECRET}"
      AUTH_SERVICE_URL: http://auth-service:8080/api/v1
      ARTIFACTS_HTTP_ADDR: ":8081"
      ARTIFACTS_ASSET_DIR: /data/assets
      ARTIFACTS_ASSET_PUBLIC_URL: /media-files
      ARTIFACTS_PUBLIC_BASE_URL: "${PUBLIC_URL}"
    volumes:
      - artifacts_service_data:/data
  visitor-service:
    <<: *backend
    build: ./Backend/visitor-service
    environment:
      DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_visitor"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET}"
      AUTH_SERVICE_URL: http://auth-service:8080/api/v1
      PORT: "8088"
  analytics-service:
    <<: *backend
    build: ./Backend/analytics-service
    environment:
      ANALYTICS_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_analytics"
      ANALYTICS_TOKEN_SECRET: "${AUTH_TOKEN_SECRET}"
      ANALYTICS_ROUTE_URL: http://route-service:8083/api/v1
      ANALYTICS_FEEDBACK_URL: http://feedback-service:8086/api/v1
      ANALYTICS_HTTP_ADDR: ":8085"
      ANALYTICS_AUTH_URL: http://auth-service:8080/api/v1
      ANALYTICS_ARTIFACTS_URL: http://artifacts-service:8081/api/v1
      ANALYTICS_ARTIFACTS_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_artifacts"
  route-service:
    <<: *backend
    build:
      context: ./Backend
      dockerfile: route-service/Dockerfile
    environment:
      ROUTE_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_route"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET}"
      AUTH_SERVICE_URL: http://auth-service:8080/api/v1
      ARTIFACTS_SERVICE_URL: http://artifacts-service:8081/api/v1
      ROUTE_ARTIFACTS_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_artifacts"
  feedback-service:
    <<: *backend
    build:
      context: ./Backend
      dockerfile: feedback-service/Dockerfile
    environment:
      FEEDBACK_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_feedback"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET}"
      AUTH_SERVICE_URL: http://auth-service:8080/api/v1
      ARTIFACTS_SERVICE_URL: http://artifacts-service:8081/api/v1
  notification-service:
    <<: *backend
    build:
      context: ./Backend
      dockerfile: notification-service/Dockerfile
    environment:
      NOTIFICATION_DB_DSN: "postgresql://viralabs:${POSTGRES_PASSWORD}@postgres:5432/viralabs_notification"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET}"
      AUTH_SERVICE_URL: http://auth-service:8080/api/v1
      ROUTE_SERVICE_URL: http://route-service:8083/api/v1
      FEEDBACK_SERVICE_URL: http://feedback-service:8086/api/v1
  dashboard-service:
    <<: *backend
    build: ./Backend/dashboard-service
    environment:
      DASHBOARD_HTTP_ADDR: ":8084"
      DASHBOARD_ANALYTICS_URL: http://analytics-service:8085
      DASHBOARD_ROUTE_URL: http://route-service:8083
      DASHBOARD_FEEDBACK_URL: http://feedback-service:8086
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?set SITE_ADDRESS, e.g. vitrineapp.ru}"
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-service
      - artifacts-service
      - visitor-service
      - route-service
      - feedback-service
      - notification-service
      - analytics-service
      - dashboard-service
volumes:
  postgres_data:
  artifacts_service_data:
  caddy_data:
  caddy_config:
