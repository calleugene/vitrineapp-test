server {
    listen 80;
    listen [::]:80;
    server_name vitrineapp.ru www.vitrineapp.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vitrineapp.ru www.vitrineapp.ru;

    ssl_certificate /etc/letsencrypt/live/vitrineapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitrineapp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vitrina/public_html;
    index index.html;

    location = /methodist { return 308 /methodist/; }
    location ^~ /methodist/ {
        root /var/www/vitrina;
        try_files $uri $uri/ /methodist/index.html;
    }

    location = /visitor { return 308 /visitor/; }
    location ^~ /visitor/ {
        root /var/www/vitrina;
        try_files $uri $uri/ /visitor/index.html;
    }

    # Visitor routes use root-level links and QR URLs.
    location ~ ^/(museums|collection|profile|routes|exhibits|m[0-9]+|a[0-9]+|a)(/|$) {
        rewrite ^ /visitor/index.html last;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8080/;
        include proxy_params;
    }
    location ^~ /api/artifacts/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8081/;
        include proxy_params;
    }
    location ^~ /api/visitor/ {
        proxy_pass http://127.0.0.1:8088/;
        include proxy_params;
    }
    location ^~ /api/route/ {
        proxy_pass http://127.0.0.1:8083/;
        include proxy_params;
    }
    location ^~ /api/feedback/ {
        proxy_pass http://127.0.0.1:8086/;
        include proxy_params;
    }
    location ^~ /api/notification/ {
        proxy_pass http://127.0.0.1:8087/;
        include proxy_params;
    }
    location ^~ /api/analytics/ {
        proxy_pass http://127.0.0.1:8085/;
        include proxy_params;
    }
    location ^~ /api/dashboard/ {
        proxy_pass http://127.0.0.1:8084/;
        include proxy_params;
    }
    location ^~ /media-files/ {
        rewrite ^/media-files/(.*)$ /assets/$1 break;
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location = /send-lead.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
