    # Only this isolated public document may be framed by external sites.
    location ^~ /embed/exhibits/ {
        root /var/www/vitrina/visitor;
        try_files /embed.html =404;
        default_type text/html;
        access_log off;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), xr-spatial-tracking=()" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Do not persist visitor request metadata for public iframe delivery/counting.
    location ^~ /api/artifacts/api/v1/public/artifacts/ {
        access_log off;
        proxy_pass http://127.0.0.1:8081/api/v1/public/artifacts/;
        include proxy_params;
    }

