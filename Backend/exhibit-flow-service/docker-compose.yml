services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exhibit_flow
      POSTGRES_USER: exhibit
      POSTGRES_PASSWORD: exhibit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exhibit -d exhibit_flow"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - exhibit-flow-postgres:/var/lib/postgresql/data

  exhibit-flow:
    build: .
    environment:
      EXHIBIT_FLOW_HTTP_ADDR: :8091
      EXHIBIT_FLOW_DB_DSN: postgres://exhibit:exhibit@postgres:5432/exhibit_flow?sslmode=disable
      EXHIBIT_FLOW_DEMO_MODE: "true"
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  exhibit-flow-postgres:
